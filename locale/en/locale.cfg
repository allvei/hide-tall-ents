[mod-name]
custom-tall-entities=Tall entity opacity tweak

[mod-description]
custom-tall-entities=Configure the tint and opacity used when tall entities are hidden, including making them completely invisible.

[mod-setting-name]
custom-tall-entities-tint=Tall entity tint
custom-tall-entities-overrides=Tall entity overrides

[mod-setting-description]
custom-tall-entities-tint=Color and alpha applied to tall entities while "Hide tall entities" mode is active. Set the alpha slider to 0 to make them completely invisible.
custom-tall-entities-overrides=Comma-separated list of entity names to treat as tall entities. Prefix a name with ! to stop it from being treated as tall. Example: roboport,agricultural-tower,!rail-support
